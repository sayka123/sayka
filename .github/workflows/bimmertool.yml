name: BimmerTool

on:
  push:
    paths: ["BimmerTool/**", ".github/workflows/bimmertool.yml"]
  pull_request:
    paths: ["BimmerTool/**", ".github/workflows/bimmertool.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BimmerTool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v

  windows-exe:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: BimmerTool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v
      - run: python -m pip install pyinstaller==6.*
      - run: pyinstaller --noconfirm --onefile --windowed --name BimmerTool BimmerTool.py
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist/BimmerTool.exe, sim_kodlama_ornek.json, sim_ix_olcumler.json, README.md out/
      - uses: actions/upload-artifact@v4
        with:
          name: BimmerTool-windows
          path: BimmerTool/out/
