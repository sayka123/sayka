name: GaryIPTV

on:
  push:
    paths: ["GaryIPTV/**", ".github/workflows/gary-iptv.yml"]
  pull_request:
    paths: ["GaryIPTV/**", ".github/workflows/gary-iptv.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GaryIPTV
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/*.test.js
