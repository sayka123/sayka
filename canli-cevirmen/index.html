<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canlı Çevirmen</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #111827; color: #f3f4f6; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
  h1 { margin: 0 0 16px; font-size: 1.6rem; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
  select, button, textarea { font: inherit; border-radius: 8px; border: 1px solid #374151; background: #1f2937; color: inherit; }
  select, button { padding: 8px 12px; }
  button { cursor: pointer; }
  button.primary { background: #2563eb; border-color: #2563eb; }
  button.primary.on { background: #dc2626; border-color: #dc2626; }
  label { display: flex; gap: 6px; align-items: center; }
  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 700px) { .panes { grid-template-columns: 1fr; } }
  .pane { background: #1f2937; border-radius: 10px; padding: 12px; min-height: 260px; display: flex; flex-direction: column; }
  .pane h2 { margin: 0 0 8px; font-size: .9rem; color: #9ca3af; text-transform: uppercase; }
  .log { flex: 1; overflow-y: auto; max-height: 50vh; font-size: 1.15rem; line-height: 1.5; }
  .log p { margin: 0 0 8px; }
  .interim { color: #9ca3af; font-style: italic; }
  textarea { width: 100%; padding: 8px; margin-top: 12px; resize: vertical; }
  #status { color: #9ca3af; font-size: .9rem; margin-top: 12px; min-height: 1.2em; }
  .warn { color: #fbbf24; }
</style>
</head>
<body>
<main>
  <h1>🎙️ Canlı Çevirmen</h1>

  <div class="bar">
    <select id="from" aria-label="Kaynak dil"></select>
    <button id="swap" title="Dilleri değiştir">⇄</button>
    <select id="to" aria-label="Hedef dil"></select>
    <button id="mic" class="primary">🎤 Dinlemeyi başlat</button>
    <label><input type="checkbox" id="speak"> Çeviriyi sesli oku</label>
    <button id="clear">Temizle</button>
  </div>

  <div class="panes">
    <section class="pane">
      <h2>Konuşma / Metin</h2>
      <div class="log" id="srcLog"></div>
    </section>
    <section class="pane">
      <h2>Çeviri</h2>
      <div class="log" id="dstLog"></div>
    </section>
  </div>

  <textarea id="typed" rows="2" placeholder="Ya da buraya yazın — yazarken anında çevrilir…"></textarea>
  <div id="status"></div>
</main>

<script>
const LANGS = [
  ['tr', 'tr-TR', 'Türkçe'], ['en', 'en-US', 'İngilizce'], ['de', 'de-DE', 'Almanca'],
  ['fr', 'fr-FR', 'Fransızca'], ['es', 'es-ES', 'İspanyolca'], ['it', 'it-IT', 'İtalyanca'],
  ['ru', 'ru-RU', 'Rusça'], ['ar', 'ar-SA', 'Arapça'], ['zh-CN', 'zh-CN', 'Çince'],
  ['ja', 'ja-JP', 'Japonca'], ['ko', 'ko-KR', 'Korece'], ['pt', 'pt-PT', 'Portekizce'],
  ['nl', 'nl-NL', 'Hollandaca'], ['el', 'el-GR', 'Yunanca'], ['uk', 'uk-UA', 'Ukraynaca'],
];
const $ = id => document.getElementById(id);
const fromSel = $('from'), toSel = $('to'), srcLog = $('srcLog'), dstLog = $('dstLog');
const statusEl = $('status'), micBtn = $('mic');

for (const sel of [fromSel, toSel]) {
  for (const [code, , name] of LANGS) sel.add(new Option(name, code));
}
fromSel.value = localStorage.getItem('from') || 'tr';
toSel.value = localStorage.getItem('to') || 'en';
fromSel.onchange = toSel.onchange = () => {
  localStorage.setItem('from', fromSel.value);
  localStorage.setItem('to', toSel.value);
  if (listening) { recognition.lang = speechLocale(fromSel.value); recognition.stop(); }
};
$('swap').onclick = () => { [fromSel.value, toSel.value] = [toSel.value, fromSel.value]; fromSel.onchange(); };
$('clear').onclick = () => { srcLog.textContent = ''; dstLog.textContent = ''; $('typed').value = ''; };

const speechLocale = code => LANGS.find(l => l[0] === code)[1];
const setStatus = (msg, warn = false) => { statusEl.textContent = msg; statusEl.className = warn ? 'warn' : ''; };

// Gemini via server.py when GEMINI_API_KEY is set; otherwise free MyMemory API (~500 chars/request).
const cache = new Map();
const langName = code => LANGS.find(l => l[0] === code)[2];
let geminiOn = false;
fetch('/api/config').then(r => r.json()).then(c => {
  geminiOn = !!c.gemini;
  if (geminiOn) setStatus('Gemini ile çeviri aktif (' + c.model + ')');
}).catch(() => {});

async function myMemory(text, pair) {
  const url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text.slice(0, 500)) +
              '&langpair=' + encodeURIComponent(pair);
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  if (data.responseStatus !== 200 && data.responseStatus !== '200') throw new Error(data.responseDetails || 'Çeviri hatası');
  return decodeEntities(data.responseData.translatedText);
}
async function viaGemini(text) {
  const res = await fetch('/api/translate', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text, from: langName(fromSel.value), to: langName(toSel.value) }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'HTTP ' + res.status);
  return data.translation;
}
async function translate(text) {
  text = text.trim();
  if (!text) return '';
  const pair = `${fromSel.value}|${toSel.value}`;
  if (fromSel.value === toSel.value) return text;
  const key = pair + '\n' + text;
  if (cache.has(key)) return cache.get(key);
  let out;
  if (geminiOn) {
    try { out = await viaGemini(text); } catch { out = await myMemory(text, pair); }
  } else out = await myMemory(text, pair);
  cache.set(key, out);
  return out;
}
function decodeEntities(s) { const t = document.createElement('textarea'); t.innerHTML = s; return t.value; }

function speak(text) {
  if (!$('speak').checked || !text || !window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = speechLocale(toSel.value);
  speechSynthesis.speak(u);
}

function addLine(log, text, cls) {
  const p = document.createElement('p');
  p.textContent = text;
  if (cls) p.className = cls;
  log.appendChild(p);
  log.scrollTop = log.scrollHeight;
  return p;
}

// Interim lines are reused/replaced until the recognizer finalizes the phrase.
let interimSrc = null, interimDst = null, interimTimer = null, interimSeq = 0;
function showInterim(text) {
  if (!interimSrc) { interimSrc = addLine(srcLog, '', 'interim'); interimDst = addLine(dstLog, '', 'interim'); }
  interimSrc.textContent = text;
  clearTimeout(interimTimer);
  const seq = ++interimSeq;
  interimTimer = setTimeout(async () => {
    try {
      const t = await translate(text);
      if (seq === interimSeq && interimDst) interimDst.textContent = t;
    } catch { /* final result will retry */ }
  }, 400);
}
async function commitFinal(text) {
  clearTimeout(interimTimer); interimSeq++;
  const src = interimSrc || addLine(srcLog, ''), dst = interimDst || addLine(dstLog, '');
  interimSrc = interimDst = null;
  src.className = ''; src.textContent = text;
  dst.className = 'interim'; dst.textContent = dst.textContent || '…';
  try {
    const t = await translate(text);
    dst.className = ''; dst.textContent = t;
    setStatus('');
    speak(t);
  } catch (e) {
    dst.className = 'warn'; dst.textContent = '⚠ ' + e.message;
  }
  dstLog.scrollTop = dstLog.scrollHeight;
}

// Speech recognition (Chrome / Edge / Safari).
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null, listening = false;
if (!SR) {
  micBtn.disabled = true;
  setStatus('Bu tarayıcı konuşma tanımayı desteklemiyor. Chrome veya Edge kullanın; yazarak çeviri yine çalışır.', true);
} else {
  recognition = new SR();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) commitFinal(r[0].transcript.trim());
      else interim += r[0].transcript;
    }
    if (interim.trim()) showInterim(interim.trim());
  };
  recognition.onerror = e => {
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    if (e.error === 'not-allowed') { listening = false; updateMic(); }
    setStatus('Mikrofon hatası: ' + e.error, true);
  };
  // Browsers end sessions after silence; restart to keep listening continuously.
  recognition.onend = () => { if (listening) { recognition.lang = speechLocale(fromSel.value); try { recognition.start(); } catch {} } };
  micBtn.onclick = () => {
    listening = !listening;
    if (listening) { recognition.lang = speechLocale(fromSel.value); recognition.start(); setStatus('Dinleniyor…'); }
    else { recognition.stop(); setStatus(''); }
    updateMic();
  };
}
function updateMic() {
  micBtn.classList.toggle('on', listening);
  micBtn.textContent = listening ? '⏹ Durdur' : '🎤 Dinlemeyi başlat';
}

// Typed input: translate as you type (debounced).
let typedTimer = null;
$('typed').addEventListener('input', e => {
  clearTimeout(typedTimer);
  const text = e.target.value;
  typedTimer = setTimeout(() => { if (text.trim()) showInterim(text.trim()); }, 300);
});
$('typed').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    clearTimeout(typedTimer);
    const text = e.target.value.trim();
    if (text) { commitFinal(text); e.target.value = ''; }
  }
});
</script>
</body>
</html>
